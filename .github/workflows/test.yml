name: Test

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:

  static:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: leango
          POSTGRES_PASSWORD: leango
          POSTGRES_DB: leango_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U leango -d leango_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Point tests at the CI Postgres service. Without this the tests start their own testcontainers
      # Postgres (pkg/testdb), which this job does not need. $RAND is a literal here: the app replaces it per
      # test process for schema isolation.
      GO_DATABASE_TESTCONNECTION: "postgres://leango:leango@localhost:5432/leango_test?sslmode=disable&search_path=test_$RAND"

    steps:
    - uses: actions/checkout@v4
      with:
        # The secrets scan reads the whole history.
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: go.sum

    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        # Same as the oven/bun image of the Dockerfile.
        bun-version: 1.4.2

    - name: Set up golangci-lint
      uses: golangci/golangci-lint-action@v8
      with:
        version: v2.14.0
        install-only: true

    - name: Set up just
      uses: extractions/setup-just@v4

    - name: Install Tailwind
      # main.css is build output, not committed, embedded in the binary: `just test` builds it and app.js.
      # Same pinned version as the Docker build (versions.env).
      run: just tailwind-install

    - name: Install JS packages
      run: bun install --frozen-lockfile

    # Every gate runs even when an earlier one failed, so one run shows all that is wrong.
    - name: SQL
      if: ${{ !cancelled() }}
      run: just sqlc-vet sqlc-verify

    - name: Lint
      if: ${{ !cancelled() }}
      run: just lint

    - name: Go vulnerabilities
      if: ${{ !cancelled() }}
      run: just vuln

    - name: Types
      if: ${{ !cancelled() }}
      run: just types

    - name: Secrets
      if: ${{ !cancelled() }}
      run: just secrets

    - name: Dependencies
      if: ${{ !cancelled() }}
      run: just deps

    - name: Duplicate code
      if: ${{ !cancelled() }}
      run: just dupes

    - name: Tests
      if: ${{ !cancelled() }}
      run: just test

    - name: Build
      if: ${{ !cancelled() }}
      run: just build

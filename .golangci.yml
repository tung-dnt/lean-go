version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - revive
    - gosec
    - errorlint
    - ineffassign
    - unused
  exclusions:
    # sqlc output carries a "Code generated ... DO NOT EDIT." header, so it is skipped.
    generated: strict
